services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${WATCHTOWER_POSTGRES_DB:-watchtower}
      POSTGRES_USER: ${WATCHTOWER_POSTGRES_USER:-watchtower}
      POSTGRES_PASSWORD: ${WATCHTOWER_POSTGRES_PASSWORD:-watchtower}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      WATCHTOWER_DATABASE_URL: postgresql+asyncpg://${WATCHTOWER_POSTGRES_USER:-watchtower}:${WATCHTOWER_POSTGRES_PASSWORD:-watchtower}@db:5432/${WATCHTOWER_POSTGRES_DB:-watchtower}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    environment:
      WATCHTOWER_DATABASE_URL: postgresql+asyncpg://${WATCHTOWER_POSTGRES_USER:-watchtower}:${WATCHTOWER_POSTGRES_PASSWORD:-watchtower}@db:5432/${WATCHTOWER_POSTGRES_DB:-watchtower}
      WATCHTOWER_ENVIRONMENT: ${WATCHTOWER_ENVIRONMENT:-local}
    ports:
      - "${WATCHTOWER_API_PORT:-8010}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      WATCHTOWER_DATABASE_URL: postgresql+asyncpg://${WATCHTOWER_POSTGRES_USER:-watchtower}:${WATCHTOWER_POSTGRES_PASSWORD:-watchtower}@db:5432/${WATCHTOWER_POSTGRES_DB:-watchtower}
      WATCHTOWER_ENVIRONMENT: test
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
