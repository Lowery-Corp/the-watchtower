services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${WATCHTOWER_POSTGRES_DB:-watchtower}
      POSTGRES_USER: ${WATCHTOWER_POSTGRES_USER:-watchtower}
      POSTGRES_PASSWORD: ${WATCHTOWER_POSTGRES_PASSWORD:-watchtower}
    ports:
      - "127.0.0.1:${WATCHTOWER_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      WATCHTOWER_DATABASE_URL: postgresql+asyncpg://${WATCHTOWER_POSTGRES_USER:-watchtower}:${WATCHTOWER_POSTGRES_PASSWORD:-watchtower}@db:5432/${WATCHTOWER_POSTGRES_DB:-watchtower}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    environment:
      WATCHTOWER_DATABASE_URL: postgresql+asyncpg://${WATCHTOWER_POSTGRES_USER:-watchtower}:${WATCHTOWER_POSTGRES_PASSWORD:-watchtower}@db:5432/${WATCHTOWER_POSTGRES_DB:-watchtower}
      WATCHTOWER_ENVIRONMENT: ${WATCHTOWER_ENVIRONMENT:-local}
      WATCHTOWER_AUTH_SERVICE_URL: ${WATCHTOWER_AUTH_SERVICE_URL:-https://dauth.johnmgrubbs.io}
      WATCHTOWER_AUTH_SERVICE_TIMEOUT_SECONDS: ${WATCHTOWER_AUTH_SERVICE_TIMEOUT_SECONDS:-5}
      WATCHTOWER_SESSION_COOKIE_NAME: ${WATCHTOWER_SESSION_COOKIE_NAME:-watchtower_session}
      WATCHTOWER_SESSION_COOKIE_MAX_AGE_SECONDS: ${WATCHTOWER_SESSION_COOKIE_MAX_AGE_SECONDS:-3600}
      WATCHTOWER_SESSION_COOKIE_SECURE: ${WATCHTOWER_SESSION_COOKIE_SECURE:-false}
      WATCHTOWER_SESSION_COOKIE_SAME_SITE: ${WATCHTOWER_SESSION_COOKIE_SAME_SITE:-lax}
      WATCHTOWER_BROWSER_ALLOWED_ORIGINS: '${WATCHTOWER_BROWSER_ALLOWED_ORIGINS:-["http://localhost:5174","http://127.0.0.1:5174","https://dwatchtower.johnmgrubbs.io"]}'
      WATCHTOWER_WEBHOOK_SECRETS: '${WATCHTOWER_WEBHOOK_SECRETS:-{}}'
      WATCHTOWER_LEGACY_WEBHOOK_PROFILES: '${WATCHTOWER_LEGACY_WEBHOOK_PROFILES:-{}}'
      WATCHTOWER_WEBHOOK_SIGNATURE_TOLERANCE_SECONDS: ${WATCHTOWER_WEBHOOK_SIGNATURE_TOLERANCE_SECONDS:-300}
      WATCHTOWER_MAX_WEBHOOK_BODY_BYTES: ${WATCHTOWER_MAX_WEBHOOK_BODY_BYTES:-262144}
      WATCHTOWER_WEBHOOK_RATE_LIMIT_REQUESTS: ${WATCHTOWER_WEBHOOK_RATE_LIMIT_REQUESTS:-60}
      WATCHTOWER_WEBHOOK_RATE_LIMIT_WINDOW_SECONDS: ${WATCHTOWER_WEBHOOK_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "127.0.0.1:${WATCHTOWER_API_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: ./watchtowersHouse
      target: runtime
    environment:
      WATCHTOWER_MAX_REQUEST_BODY_BYTES: ${WATCHTOWER_MAX_REQUEST_BODY_BYTES:-262144}
    ports:
      - "${WATCHTOWER_FRONTEND_PORT:-5174}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  frontend-tools:
    profiles: ["test"]
    build:
      context: ./watchtowersHouse
      target: tools
    command: ["npm", "test"]

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      WATCHTOWER_DATABASE_URL: postgresql+asyncpg://${WATCHTOWER_POSTGRES_USER:-watchtower}:${WATCHTOWER_POSTGRES_PASSWORD:-watchtower}@db:5432/${WATCHTOWER_POSTGRES_DB:-watchtower}
      WATCHTOWER_ENVIRONMENT: test
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
