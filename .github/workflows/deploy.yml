name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: build and deploy

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose --profile test config -q

      - name: Build test images
        run: docker compose --profile test build test frontend-tools

      - name: Run backend tests
        run: docker compose run --rm test pytest -q

      - name: Run frontend tests
        run: docker compose run --rm --no-deps frontend-tools npm test

      - name: Lint frontend
        run: docker compose run --rm --no-deps frontend-tools npm run lint

      - name: Clean up test containers
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push watchtower-frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./watchtowersHouse
          file: ./watchtowersHouse/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/watchtower-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/watchtower-frontend:${{ github.sha }}

      - name: Build and push watchtower-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/watchtower-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/watchtower-api:${{ github.sha }}

      - name: Connect GitHub Actions to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy on server over Tailscale
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/watchtower-api:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/watchtower-frontend:latest

            cd /home/${{ secrets.SERVER_USER }}/the-watchtower

            docker compose down || true
            docker compose up -d --build || true

            docker image prune -f
