services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${WATCHTOWER_POSTGRES_DB:-watchtower}
      POSTGRES_USER: ${WATCHTOWER_POSTGRES_USER:-watchtower}
      POSTGRES_PASSWORD: ${WATCHTOWER_POSTGRES_PASSWORD:-watchtower}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./watchtowers-backend
      dockerfile: Dockerfile
    env_file:
      - ./watchtowers-backend/.env
    working_dir: /app
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    volumes:
      - ./watchtowers-backend:/app
    depends_on:
      postgres:
        condition: service_healthy

