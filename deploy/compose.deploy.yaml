services:
  db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${WATCHTOWER_POSTGRES_PASSWORD:?set WATCHTOWER_POSTGRES_PASSWORD in the server .env}

  migrate:
    image: "${WATCHTOWER_API_IMAGE:?set WATCHTOWER_API_IMAGE to an immutable digest reference}"

  api:
    image: "${WATCHTOWER_API_IMAGE:?set WATCHTOWER_API_IMAGE to an immutable digest reference}"
    environment:
      WATCHTOWER_ENVIRONMENT: ${WATCHTOWER_ENVIRONMENT:?set WATCHTOWER_ENVIRONMENT in the server .env}
      WATCHTOWER_AUTH_SERVICE_URL: ${WATCHTOWER_AUTH_SERVICE_URL:?set WATCHTOWER_AUTH_SERVICE_URL in the server .env}
      WATCHTOWER_SESSION_COOKIE_SECURE: ${WATCHTOWER_SESSION_COOKIE_SECURE:?set WATCHTOWER_SESSION_COOKIE_SECURE in the server .env}
      WATCHTOWER_BROWSER_ALLOWED_ORIGINS: '${WATCHTOWER_BROWSER_ALLOWED_ORIGINS:?set WATCHTOWER_BROWSER_ALLOWED_ORIGINS in the server .env}'

  frontend:
    image: "${WATCHTOWER_FRONTEND_IMAGE:?set WATCHTOWER_FRONTEND_IMAGE to an immutable digest reference}"
