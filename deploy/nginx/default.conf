limit_req_zone $binary_remote_addr zone=watchtower_webhooks:10m rate=60r/m;

map $http_x_request_id $watchtower_request_id {
    default $request_id;
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
}


upstream watchtower_api {
    server api:8000;
    keepalive 16;
}

upstream watchtower_frontend {
    server frontend:8080;
    keepalive 8;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    client_max_body_size 256k;
    limit_req_status 429;
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $watchtower_request_id always;

    location = /api/v1/webhooks/events {
        limit_req zone=watchtower_webhooks burst=20 nodelay;
        proxy_pass http://watchtower_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $watchtower_request_id;
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://watchtower_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $watchtower_request_id;
    }

    location / {
        proxy_pass http://watchtower_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
